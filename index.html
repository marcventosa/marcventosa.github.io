    <!-- Update current year dynamically -->
    <script>
      (function() {
        const updateYear = () => {
          const yearSpan = document.getElementById('current-year');
          if (yearSpan) {
            yearSpan.textContent = new Date().getFullYear();
          }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', updateYear);
        } else {
          updateYear();
        }
      })();
    </script>
    <!-- Restored Slitscan Effect Initialization -->
<script type="module">
  import CargoSlitScan from './js/cargo-slitscan-enhanced.js';
  import CargoBackdrop from './js/cargo-backdrop.js';

  // Preloaded state following Cargo.site structure
  window.__PRELOADED_STATE__ = {
    site: {
      backdrops: {
        activeBackdrop: "legacy/slitscan",
        backdropSettings: {
          "legacy/slitscan": {
            image: "images/peces2-bp3.png",
            scan_size: 100,
            scan_cycles: 2,
            wiggle: 4,
            target_speed: 40,
            orientation: "vertical",
            mouse_interaction: true,
            scroll_interaction: true
          }
        }
      }
    }
  };

  const homeSection = document.getElementById('home');
  if (!homeSection) {
    console.error('Section #home not found');
  } else {
    console.log('Initializing optimized slitscan effect for #home section...');

    // Get backdrop settings from preloaded state
    const backdropSettings = window.__PRELOADED_STATE__.site.backdrops.backdropSettings["legacy/slitscan"];

    const isMobile = window.matchMedia('(max-width: 768px)').matches;

    // Initialize slitscan effect with optimized parameters
    const slitScan = new CargoSlitScan({
      container: homeSection,
      imageUrl: backdropSettings.image,
      width: homeSection.offsetWidth,
      height: homeSection.offsetHeight,
      scan_size: backdropSettings.scan_size,
      scan_cycles: backdropSettings.scan_cycles,
      wiggle: isMobile ? 3 : backdropSettings.wiggle,
      target_speed: isMobile ? 22 : backdropSettings.target_speed,
      orientation: backdropSettings.orientation,
      mouse_interaction: backdropSettings.mouse_interaction,
      scroll_interaction: backdropSettings.scroll_interaction,
      mirror_horizontal: true,
      mirror_vertical: false,
      wave_effect: true
    });

    console.log('Optimized slitscan effect initialized successfully for #home section');

    // Expose instance so the overlay router can fade it in/out.
    window.slitScan = slitScan;
  }
</script>
